services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Youwe\BluestonePim\Migration\MigrationInterface:
            tags: ['youwe.bluestone_pim.migration']
        Youwe\BluestonePim\Api\Connector\AbstractConnector:
            tags: ['youwe.bluestone_pim.api_connector']

    Youwe\BluestonePim\:
        resource: '../../'
        exclude:
            - '../../BluestonePimBundle.php'
            - '../../DependencyInjection/'
            - '../../Migration/MigrationDefinition.php'
            - '../../Migration/MigrationContext.php'
            - '../../Migration/AbstractPimMigration.php'
            - '../../Console/SdkConsoleKernel.php'
            - '../../Api/BluestoneApiException.php'

    youwe_bluestone_pim.migrations_connection:
        class: Doctrine\DBAL\Connection
        factory: ['Youwe\BluestonePim\Database\ConnectionFactory', 'create']
        arguments: ['%env(resolve:default:youwe_bluestone_pim.default_migrations_database_url:BLUESTONE_MIGRATIONS_DATABASE_URL)%']

    Youwe\BluestonePim\Api\BluestoneClient:
        arguments:
            $baseUrl: '%env(default:youwe_bluestone_pim.default_api_base_url:BLUESTONE_API_BASE_URL)%'
            $tokenUrl: '%env(default:youwe_bluestone_pim.default_token_url:BLUESTONE_TOKEN_URL)%'
            $clientId: '%env(default:youwe_bluestone_pim.empty:BLUESTONE_CLIENT_ID)%'
            $clientSecret: '%env(default:youwe_bluestone_pim.empty:BLUESTONE_CLIENT_SECRET)%'
            $publicApiKey: '%env(default:youwe_bluestone_pim.empty:BLUESTONE_PUBLIC_API_KEY)%'

    Youwe\BluestonePim\Service\MediaUploadRunner:
        arguments:
            $transferEncryptionKey: '%env(default:youwe_bluestone_pim.empty:BLUESTONE_MEDIA_TRANSFER_KEY)%'
            $allowedTransferHosts: '%env(default:youwe_bluestone_pim.empty:BLUESTONE_MEDIA_UPLOAD_HOSTS)%'

    Youwe\BluestonePim\Api\OperationCatalog:
        arguments:
            $directory: '%youwe_bluestone_pim.resources_dir%'

    Youwe\BluestonePim\Api\RevisionActivation:
        arguments:
            $directory: '%youwe_bluestone_pim.resources_dir%'

    Youwe\BluestonePim\Api\LiveFixtureSelection:
        arguments:
            $policyFile: '%youwe_bluestone_pim.resources_dir%/live-fixture-policy.json'
            $statusFile: '%youwe_bluestone_pim.resources_dir%/live-verification-status.json'

    Youwe\BluestonePim\Api\TypedApiAdapterFactory:
        arguments:
            $connectors: !tagged_iterator youwe.bluestone_pim.api_connector
            $sdkRoot: '%youwe_bluestone_pim.sdk_root%'

    Youwe\BluestonePim\Migration\MigrationStorage:
        arguments:
            $connection: '@youwe_bluestone_pim.migrations_connection'
            $target: '%env(default:youwe_bluestone_pim.empty:BLUESTONE_TARGET)%'
            $baseUrl: '%env(default:youwe_bluestone_pim.default_api_base_url:BLUESTONE_API_BASE_URL)%'

    Youwe\BluestonePim\Migration\MigrationLock:
        arguments:
            $connection: '@youwe_bluestone_pim.migrations_connection'

    Youwe\BluestonePim\Migration\MigrationRegistry:
        arguments:
            $migrations: !tagged_iterator youwe.bluestone_pim.migration

    Youwe\BluestonePim\Command\MakeMigrationCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $migrationDirectory: 'src/Migration'
            $migrationNamespace: 'App\Migration'
