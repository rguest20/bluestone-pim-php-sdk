imports:
    - { resource: '../src/Resources/config/services.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    BluestoneMigrations\:
        resource: '../migrations/'
        tags: ['youwe.bluestone_pim.migration']

    Youwe\BluestonePim\Command\MakeMigrationCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $migrationDirectory: 'migrations'
            $migrationNamespace: 'BluestoneMigrations'
